name: Handle stale issues

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: stale-issues
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-label: stale
          stale-issue-message: >-
            This issue has been marked as stale because it has had no activity for
            30 days. It will be closed in 7 days unless there is new activity.
            If this still affects you, please comment with the latest app version,
            whether the problem is still reproducible, and any updated details.
          close-issue-message: >-
            This issue has been automatically closed after 7 additional days
            without activity since being marked stale. If this still affects you,
            please provide updated details and ask a maintainer to reopen it.
          days-before-stale: 30
          days-before-close: 7
          close-issue-reason: not_planned
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: never-stale,help wanted,on-roadmap,pinned,security
          remove-issue-stale-when-updated: true
          remove-pr-stale-when-updated: false
          operations-per-run: 100
